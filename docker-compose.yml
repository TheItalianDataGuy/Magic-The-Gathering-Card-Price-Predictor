version: '3.8'

x-airflow-common: &airflow-common
  build: .
  image: mtg-airflow:latest
  environment:
    AIRFLOW_HOME: /opt/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAG_FOLDER: /opt/airflow/dags
    PYTHONPATH: /opt/airflow:/opt/airflow/src
    AIRFLOW__SMTP__SMTP_USER: ${SMTP_USER}
    AIRFLOW__SMTP__SMTP_PASSWORD: ${SMTP_PASSWORD}
    AIRFLOW__SMTP__SMTP_HOST: ${SMTP_HOST}
    AIRFLOW__SMTP__SMTP_PORT: ${SMTP_PORT}
    AIRFLOW__SMTP__SMTP_MAIL_FROM: ${MAIL_FROM}
    AIRFLOW__SMTP__SMTP_STARTTLS: 'True'
    AIRFLOW__SMTP__SMTP_SSL: 'False'
  volumes:
    - ./airflow:/opt/airflow
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - .env:/opt/airflow/.env
    - ./variables.json:/opt/airflow/variables.json
  healthcheck:
    test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
    interval: 30s
    timeout: 10s
    retries: 5

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-init:
    <<: *airflow-common
    entrypoint: >
      bash -c "
      export PATH=$PATH:/home/airflow/.local/bin &&
      airflow db migrate &&
      airflow users create --username admin --password admin --firstname Air --lastname Flow --role Admin --email admin@example.com
      "
    depends_on:
      - postgres

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    restart: always
    depends_on:
      - airflow-init
    ports:
      - "8080:8080"

  airflow-scheduler:
    <<: *airflow-common
    command: airflow scheduler
    restart: always
    depends_on:
      - airflow-webserver

  mtg-fetch:
    build:
      context: .
    container_name: mtg-price-fetch
    environment:
      OUTPUT_FILE: /opt/airflow/data/raw/scryfall_data.csv
    volumes:
      - ./airflow:/opt/airflow
      - ./src:/opt/airflow/src
      - ./data:/opt/airflow/data
    command: python /opt/airflow/src/data_ingestion/fetch_scryfall_prices.py

volumes:
  postgres-db-volume:
